# License notices for the crates the shipped game links, written to
# assets/licenses/third-party.txt by tools/gen_notices.sh. The accepted
# list mirrors deny.toml's.
accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Every platform the game is built for: the Apple bundles, and the Windows
# and Linux builds CI tests.
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-tvos",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
# Build and test tooling never ships.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace crates are the product, not a dependency.
private = { ignore = true }

# kira's parameter updates pass through triple_buffer, and it decodes the
# music through symphonia; deny.toml makes the same exceptions.
[triple_buffer]
accepted = ["MPL-2.0"]

[symphonia]
accepted = ["MPL-2.0"]

[symphonia-codec-vorbis]
accepted = ["MPL-2.0"]

[symphonia-common]
accepted = ["MPL-2.0"]

[symphonia-core]
accepted = ["MPL-2.0"]

[symphonia-format-ogg]
accepted = ["MPL-2.0"]

[symphonia-metadata]
accepted = ["MPL-2.0"]
