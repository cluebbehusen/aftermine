# Supply-chain policy, enforced by the CI `deny` job
# (EmbarkStudios/cargo-deny). The ignore list is a triage ledger, not a
# mute button: every entry names its reason and its exit condition.

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0035", reason = "macroquad's mutable-static soundness holes: known upstream, no fix planned, and the engine choice is deliberate. Exits with an engine change or an upstream fix." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; it arrives via fontdue via macroquad and only shell text rendering touches it. Exits with macroquad." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The nine workspace crates are publish = false and carry no license
# field; they are the product, not a dependency.
private = { ignore = true }

[bans]
# Dependencies drag duplicate majors (syn 2 and 3, bitflags 1 through png
# and 2); denying would be a standing red light nobody can turn off.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The workspace patch pins a miniquad fork for iOS scene support and a
# quad-snd fork for tvOS audio and mixing with other apps on iOS.
allow-git = [
    "https://github.com/cluebbehusen/miniquad",
    "https://github.com/cluebbehusen/quad-snd",
]
