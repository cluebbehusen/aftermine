[package]
name = "aftermine-apple-bridge"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The Objective-C bridge to Apple's frameworks: iCloud Drive files, the key-value store, a CloudKit record mirror, user defaults, the idle timer and background time"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
cc = "1"

# The workspace table forbids unsafe code, which no crate can then allow, and
# Cargo refuses a member's additions to an inherited table. This crate calls
# into Apple's frameworks, so it repeats the table with unsafe code denied
# instead and allows it in the modules that hold the calls.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
assert_is_empty = "allow"
match_same_arms = "allow"
float_cmp = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
