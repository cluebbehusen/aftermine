# Aftermine CI: lint, test, and prove cross-platform determinism.
#
# The workspace test matrix includes the state-hash fixtures, so every OS must
# reproduce hashes blessed on one machine bit-for-bit or the "same seed, same
# bits, every platform" invariant is broken.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Stacked pushes to one ref supersede each other; don't run them all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This action selects the toolchain from its @ref, except when the
      # `toolchain` input is set — then the README prescribes the master
      # revision. Pinned to a commit on master, since it has no version
      # tags.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Matches rust-toolchain.toml.
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore main's cache instead of each saving a copy
          # that only that pull request can read.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # macroquad links against the platform's windowing/audio stacks even
      # in headless test builds, and gilrs reads pads through libudev, which
      # it finds with pkg-config.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev pkg-config libudev-dev

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Lints read the same code on every OS; the few platform branches are
      # compiled by the test step everywhere and linted for iOS and tvOS below.
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The iPad and Apple TV builds compile the shell's Apple-only code, the
      # Apple bridge's Objective-C calls and the iOS and tvOS builds of the
      # miniquad and quad-snd forks. Linting both device targets here means a
      # shell change or a fork pin bump that no longer compiles for them
      # fails in CI. Linking and the simulator targets are still checked only
      # by `cargo ipad` and `cargo tv`. The macOS runner's Xcode supplies the
      # iOS and tvOS SDKs that the C and Objective-C dependencies compile
      # against.
      - name: Clippy (iOS and tvOS shell)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-tvos
          cargo clippy -p aftermine-shell -p aftermine-apple-bridge --target aarch64-apple-ios --locked -- -D warnings
          cargo clippy -p aftermine-shell -p aftermine-apple-bridge --target aarch64-apple-tvos --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
        env:
          AFTERMINE_SOAK_TRACE_DIR: ${{ runner.temp }}/soak-trace

      - name: Upload soak trace
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-trace-${{ matrix.os }}
          path: ${{ runner.temp }}/soak-trace
          if-no-files-found: error

      # Public documentation is a promise too: broken intra-doc links
      # and malformed HTML rot silently without a gate.
      - name: Docs
        if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The state-hash fixtures cover short scripted scenarios. This compares
  # the long all-bot integrity soak across operating systems, with no
  # checked-in golden: every OS must agree with the others on this commit.
  determinism:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: soak-trace-*
          path: soak-traces
      - name: Compare soak hashes across operating systems
        shell: bash
        run: |
          reference=soak-traces/soak-trace-ubuntu-latest
          status=0
          for trace in soak-traces/soak-trace-*; do
            diff -r --exclude='*.replay.json' "$reference" "$trace" || status=1
          done
          exit "$status"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Matches rust-toolchain.toml.
          toolchain: "1.99.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-llvm-cov
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev pkg-config libudev-dev jq
      - name: Coverage
        shell: bash
        run: .github/coverage.sh

  # The native suites and the smoke check open a real shell window, so the
  # workspace test run skips them. This job runs them on a virtual X display
  # with Mesa's software GL. It is a trial, kept out of the required checks
  # until its time and flake rate are known.
  native-window:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Matches rust-toolchain.toml.
          toolchain: "1.99.0"
      # Restores the check job's Linux cache, which holds the same debug
      # dependencies, and saves none of its own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
          save-if: false
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev pkg-config libudev-dev xvfb xauth libgl1-mesa-dri
      # With no sound card the shell's audio thread panics opening the
      # default device. A null device takes the samples instead. It goes in
      # the system file because the harness gives each shell its own HOME.
      - name: Route sound to a null device
        run: echo 'pcm.!default { type null }' | sudo tee /etc/asound.conf
      # Built first so the steps below time the runs alone. Each command
      # matches one those steps or the harness runs, leaving them nothing to
      # compile.
      - name: Build
        id: build
        run: |
          cargo build -p aftermine-shell --locked
          cargo build -p aftermine-driver --locked
          cargo test -p aftermine-driver --test menu_ux --test session_parity --test pad_wiring --locked --no-run
      - name: Native suites
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo test -p aftermine-driver --test menu_ux --test session_parity --test pad_wiring --locked --no-fail-fast -- --ignored --test-threads 1
        env:
          RUST_BACKTRACE: "1"
      # Runs even when a suite fails, so each trial run reports both.
      - name: Smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo run -p aftermine-driver --locked -- smoke --spawn

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npx --yes prettier@3.9.6 --check "**/*.md"

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Validate agent skills
        shell: bash
        run: |
          for skill_file in .agents/skills/*/SKILL.md; do
            skill_dir="${skill_file%/SKILL.md}"
            uvx --from skills-ref==0.1.1 agentskills validate "$skill_dir"
          done

  # Generated sprites and sounds are checked for reproducibility, and
  # their generators carry their own pinned inline Python dependencies.
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Sprite generator check
        run: uv run tools/gen_sprites.py --check
      - name: Sprite generator tests
        run: uv run --with 'pillow==12.3.0' -m unittest tools.test_gen_sprites tools.test_production_sprite_sources tools.test_gen_icon
      - name: Wordmark generator check
        run: uv run tools/gen_wordmark.py --check
      - name: Wordmark generator tests
        run: uv run --with 'pillow==12.3.0' -m unittest tools.test_gen_wordmark
      - name: Sound generator check
        run: uv run tools/gen_sounds.py --check
      - name: Sound tests
        run: uv run --with 'numpy==2.5.1' --with 'scipy==1.18.0' -m unittest tools.test_gen_sounds
      - name: Review tool tests
        run: uv run -m unittest tools.test_map_review tools.test_line_report

  # The license notices every bundle ships must match Cargo.lock.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Matches rust-toolchain.toml.
          toolchain: "1.99.0"
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-about@0.9.2
      - name: License notices
        run: sh tools/gen_notices.sh --check

  # Supply-chain gate: advisories, bans, licenses, and source policy
  # live in deny.toml, including the triage list for macroquad's stale
  # corners.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
